<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="100%" stop-color="#0e1117" />
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="coral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base background rounded square -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="105" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4" />

  <!-- 4 Jewel Blocks centered with drop shadows -->
  <g filter="url(#shadow)">
    <!-- Top-Left (Blue) -->
    <rect x="106" y="106" width="135" height="135" rx="28" fill="url(#blue)" />
    <!-- Bevel highlight -->
    <rect x="110" y="110" width="127" height="127" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />

    <!-- Top-Right (Amber) -->
    <rect x="271" y="106" width="135" height="135" rx="28" fill="url(#amber)" />
    <rect x="275" y="110" width="127" height="127" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />

    <!-- Bottom-Left (Emerald) -->
    <rect x="106" y="271" width="135" height="135" rx="28" fill="url(#emerald)" />
    <rect x="110" y="275" width="127" height="127" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />

    <!-- Bottom-Right (Coral) -->
    <rect x="271" y="271" width="135" height="135" rx="28" fill="url(#coral)" />
    <rect x="275" y="275" width="127" height="127" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />
  </g>
</svg>